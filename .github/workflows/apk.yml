name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova & Build App
        run: |
          npm install -g cordova
          cordova create appcom com.gokce.namaz VAKIT
          cd appcom
          rm -rf www/*
          cp ../index.html www/
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VAKIT-Namaz-App
          path: appcom/platforms/android/app/build/outputs/apk/debug/app-debug.apk
